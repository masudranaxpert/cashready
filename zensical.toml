[project]
site_url = "https://cashready.masud-rana.me/docs/"
site_name = "CashReady Docs"
site_description = "AI Liquidity Planning & Censored Demand Recovery for MFS Agents"
site_author = "CashReady Team"
repo_url = "https://github.com/masudranaxpert/cashready"
repo_name = "masudranaxpert/cashready"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Overview" = "index.md" },
  { "Problem" = "problem.md" },
  { "Architecture" = "ARCHITECTURE.md" },
  { "Models" = [
    { "Stock-Out Detector" = "models/detector.md" },
    { "Censored Demand Recovery" = "models/recovery.md" },
    { "Quantile Forecast" = "models/forecast.md" },
    { "Liquidity Planner" = "models/plan.md" },
    { "Explainability" = "models/explainability.md" },
  ]},
  { "Evaluation" = "evaluation.md" },
  { "API Reference" = "api.md" },
  { "Security" = "security.md" },
  { "Responsible AI" = "RESPONSIBLE_AI.md" },
  { "Economics" = "ECONOMICS.md" },
  { "Comparison" = "COMPARISON.md" },
  { "Operations" = "operations.md" },
  { "Roadmap" = "roadmap.md" },
  { "FAQ" = "faq.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
