services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashready-api
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8100}:${PORT:-8100}"
    environment:
      - PORT=${PORT:-8100}
      - ARTIFACTS_DIR=/app/artifacts/serve
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
      - API_KEY=${API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: cashready-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8200}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NODE_ENV=production
    depends_on:
      - api
