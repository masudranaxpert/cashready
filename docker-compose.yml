services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashready-api
    restart: unless-stopped
    environment:
      - PORT=${PORT:-8100}
      - ARTIFACTS_DIR=/app/artifacts/serve
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
      - API_KEY=${API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cashready-web
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://api:8100
      - NODE_ENV=production
    depends_on:
      - api
