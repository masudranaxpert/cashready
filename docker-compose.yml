services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashready-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    networks:
      - internal
    environment:
      - PORT=${PORT:-8100}
      - ARTIFACTS_DIR=/app/artifacts/serve
      - FRONTEND_ORIGIN=*
      - FRONTEND_ORIGINS=*
      - ENV=production
      - USERS_FILE=/app/config/demo_users.json
      - API_KEY=${API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cashready-web
    restart: unless-stopped
    ports:
      - "3456:3000"
    networks:
      - internal
    environment:
      - INTERNAL_API_URL=http://api:8100
      - NODE_ENV=production
    depends_on:
      - api

networks:
  internal:
    driver: bridge
